[project]
name = "prediction-for-diabetes-ml"
version = "0.1.0"
description = "Diabetes prediction from CDC BRFSS 2015 health indicators using machine learning"
readme = "README.md"
authors = [
    { name = "Gaby-projects" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
